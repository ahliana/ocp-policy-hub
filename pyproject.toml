[project]
name = "OCP-CE-HR-Policy-Searcher"
version = "0.1.0"
description = "Agent-orchestrated policy discovery hub with REST API and MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "anthropic>=0.39.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.0",
    "langdetect>=1.0.9",
    "pypdf>=4.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "gspread>=5.12.0",
    "google-auth>=2.25.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-socket>=0.8.0",  # enforces the no-network claim of `small`-marked tests
    "ruff>=0.4.0",
    "httpx",  # for TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "small: hermetic - no network (enforced via pytest-socket), no real clock, no data/",
    "medium: may touch localhost and tmp_path",
    "large: slow; excluded from the pre-commit fast run, always runs at push",
    "e2e: end-to-end through a running stack",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Entry points load .env before importing modules that read env at import time
"src/agent/__main__.py" = ["E402"]
"src/mcp/server.py" = ["E402"]
